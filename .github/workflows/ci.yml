name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: build + test (linux)
    runs-on: ubuntu-26.04
    timeout-minutes: 20

    env:
      BUILD_DIR: build
      CMAKE_BUILD_TYPE: RelWithDebInfo

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # The server needs GStreamer core plus these runtime plugins:
      #   base - videotestsrc / videoconvert / appsink
      #   good - rtph264pay (the RTSP media launch strings)
      #   bad  - h264parse
      #   ugly - x264enc, which ProfileBin.cpp instantiates at runtime
      # libgstrtspserver-1.0-dev provides gstreamer-rtsp-server-1.0.pc (a
      # separate source package from plugins-bad). It pulls good/bad in
      # transitively today; they are listed explicitly so a dependency change
      # cannot silently drop the RTSP branch.
      #
      # Qt 6.10.2 is what client-qt/ requires (CMakeLists.txt). Ubuntu 26.04
      # ships exactly that version.
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build pkg-config \
            libgstreamer1.0-dev \
            libgstreamer-plugins-base1.0-dev \
            libgstrtspserver-1.0-dev \
            gstreamer1.0-plugins-base \
            gstreamer1.0-plugins-good \
            gstreamer1.0-plugins-bad \
            gstreamer1.0-plugins-ugly \
            qt6-base-dev \
            qt6-declarative-dev \
            qt6-multimedia-dev

      - name: Show tool versions
        run: |
          cmake --version | head -1
          g++ --version | head -1
          qmake6 -query QT_VERSION
          pkg-config --modversion gstreamer-1.0 gstreamer-rtsp-server-1.0

      # Build the headless server, the tests and the Qt/QML client.
      # WITH_QT=ON turns a missing or older Qt into a configure failure instead
      # of silently skipping client-qt/ the way AUTO would.
      - name: Configure
        run: |
          cmake -S . -B "$BUILD_DIR" -G Ninja \
            -DCMAKE_BUILD_TYPE="$CMAKE_BUILD_TYPE" \
            -DCAMERA_PLATFORM_WITH_QT=ON \
            -DCAMERA_PLATFORM_BUILD_TESTS=ON

      - name: Build
        run: cmake --build "$BUILD_DIR" --parallel "$(nproc)"

      - name: Test
        run: ctest --test-dir "$BUILD_DIR" --output-on-failure

      - name: Upload test log on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: ctest-log
          path: ${{ env.BUILD_DIR }}/Testing/Temporary/LastTest.log
          if-no-files-found: ignore
